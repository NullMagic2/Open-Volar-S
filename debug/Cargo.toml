[package]
name = "a865r-debug"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desk"]
desk = ["dep:eframe", "dep:rfd", "dep:image"]

[[bin]]
name = "a865r-debug"
path = "src/main.rs"
required-features = ["desk"]

[dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
liba865r = { path = "../crates/liba865r" }
eframe = { version = "=0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "=0.16.0", optional = true, default-features = false }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }

[lib]
name = "a865r_media"
path = "src/lib.rs"
