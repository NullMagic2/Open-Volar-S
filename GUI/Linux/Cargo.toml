[package]
name = "open-volar-s-live-tv"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-volar-s-live-tv"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
a865r_media = { package = "a865r-debug", path = "../../debug" }
gtk = "=0.18.2"
serde_json = "=1.0.151"
liba865r = { path = "../../crates/liba865r" }
sha2 = "=0.10.9"

cairo-rs = { version = "=0.18.5", features = ["png"] }

[build-dependencies]
cc = "=1.4.5"
